# C Tech SocialOS — Render Blueprint (minimal, free-tier safe)
services:
  - type: web
    name: socialos-api
    runtime: docker
    rootDir: backend
    plan: free
    autoDeploy: true
    envVars:
      - key: SOCIALOS_AUTO_SEED
        value: "true"
      - key: SOCIALOS_MOCK_CONNECTORS
        value: "true"
      - key: SOCIALOS_WORKER_ENABLED
        value: "true"
      - key: SOCIALOS_LLM_PROVIDER
        value: "template"
